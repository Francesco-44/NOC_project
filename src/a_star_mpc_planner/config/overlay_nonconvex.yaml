# Overlay per i mondi con ostacoli NON CONVESSI (long_wall, horseshoe,
# dead_end di g1_sim/mujoco_world.py). Si usa cosi':
#
#   ros2 launch g1_sim g1_a_star_mpc.launch.py world:=horseshoe \
#        planner_overlay:=$(ros2 pkg prefix a_star_mpc_planner)/share/a_star_mpc_planner/config/overlay_nonconvex.yaml
#
# PERCHE' SERVE. A* pianifica su una finestra mobile larga 2*grid_half_width
# centrata sul robot. Se il goal cade fuori da quella finestra viene proiettato
# sul bordo, e con un ostacolo concavo la proiezione punta dritta dentro la
# trappola: il pianificatore non puo' aggirare cio' che non vede. Misurato su
# metrics/common.world_scenario, un solo piano dallo spawn:
#
# Misurato in ANELLO CHIUSO (metrics/common.closed_loop, un run per cella):
#
#   grid_half_width   long_wall          horseshoe    dead_end
#   6.0 (default)     bloccato           bloccato     bloccato
#   8.0               ATTRAVERSA il muro goal ok      bloccato
#   10.0              goal ok            goal ok      goal ok   <- adottato
#   14.0              goal ok            goal ok      goal ok
#
# 10.0 e' il valore adottato, ed e' quello con cui gira l'intera campagna di
# metrics/escape_test.py. Il caso che decide e' l_corridor, il mondo con il piede
# piu' lungo: dalla cima del piede (6.5, 11) l'imbocco del corridoio sta a
# (-2, 0), cioe' 8.5 m in x e 11 m in y, e la sola proiezione radiale del goal
# sul bordo della finestra non ne esce. Con la metrica geodetica sul target
# locale il piano esiste comunque: goal raggiunto in 112.7 s, clearance minima
# 0.80 m (escape_all_hw10.json, riga l_corridor/geodetica).
#
# COSTO, e perche' non si sale oltre. grid_reso resta quello del profilo (0.20),
# quindi a hw=10 la griglia e' 100x100 e un piano costa ~140 ms contro i ~50 ms
# del default: dentro il periodo di ripianificazione (replan_rate_hz 1.0), ma non
# gratis. Salire ancora costa molto in fretta, perche' il peso non e' l'A* in se'
# ma l'aggiornamento della griglia gaussiana su ~2000 punti di ostacolo. Misurato
# sul caso peggiore (l_corridor dalla cima del piede):
#
#   hw   reso   celle     ms
#   14   0.20   140x140   1838   PIU' del periodo di ripianificazione
#   14   0.25   112x112   1031
#   14   0.30    93x93     645
#   14   0.35    80x80     504
#
# A hw=14 la finestra tornerebbe utilizzabile solo diradando la griglia, e a reso
# 0.35 un canale libero di 0.9 m (la strettoia di long_wall_false_north)
# scenderebbe a ~2.6 celle, troppo poche perche' A* lo tratti in modo affidabile.
#
# Allargare la finestra NON indebolisce le trappole: da quando c'e' la
# percezione limitata, la trappola dipende dalla PORTATA DEL LIDAR (8 m) e non
# dalla finestra di pianificazione — lo spazio mai visto resta ottimisticamente
# libero in entrambi i casi. La finestra decide solo fin dove A* puo' tracciare
# una via d'uscita su cio' che gia' conosce. La
# cella "ATTRAVERSA il muro" e' un FALSO successo: l'impianto dell'harness non
# ha collisioni, il ripiego proporzionale ha puntato l'ultimo waypoint di A*
# oltre il muro e ci e' passato dentro (clearance 0.033 m). Vedi
# metrics/common.check_collisions — un goal raggiunto va sempre letto insieme alla
# clearance.
#
# La soglia non e' universale: dipende da quanto e' grande l'ostacolo concavo
# rispetto alla finestra. La regola pratica e' che la finestra deve contenere
# l'ostacolo INTERO piu' la via d'uscita, non solo la faccia che il robot vede.
#
# E' la ragione per cui la finestra larga non e' il default del profilo: si paga
# su ogni ciclo, anche nei mondi convessi che non ne hanno bisogno.
#
# ALTERNATIVA DA PROVARE PRIMA: nav_graph:=true. La memoria topologica globale
# esiste proprio per ricordare la struttura oltre la finestra, e questi tre
# mondi sono il test che non ha mai avuto. Se basta quella, la finestra puo'
# restare a 6.0 e si risparmiano i 250 ms.
# ─────────────────────────────────────────────────────────────────────────
# map_decay_sec: 0 — LA MEMORIA NON DEVE SCADERE
#
# PersistentOccupancyMap sfratta ogni cella non riconfermata entro map_decay_sec
# (20 s nel profilo G1). Su un ostacolo concavo questo e' fatale: il fondo del
# ferro di cavallo si vede solo da DENTRO, quindi appena il robot esce e
# costeggia un braccio smette di riconfermarlo. Dopo 20 s la cella viene
# sfrattata, la U torna "aperta" nella mappa, la geodetica ricalcolata ci manda
# dritto attraverso, e il robot RIENTRA. Ping-pong con periodo ~20 s.
#
# Si misura sull'orologio: uscire dalla U (4 m) e arrivare a meta' braccio (6 m)
# fa ~10 m a ~0.28 m/s = 36 s, e il rientro si osserva proprio a meta' braccio.
#
# Nessun tabu puo' rimediare: il tabu penalizza le zone gia' visitate, ma qui il
# problema non e' la scelta, e' che la MAPPA E' SBAGLIATA — il muro non c'e'
# piu'. Prima si ripara cio' che il robot sa, poi semmai come decide.
#
# Il decadimento a tempo serve agli ostacoli DINAMICI (persone), ma il criterio
# e' sbagliato in partenza: sfratta le celle che non si sono GUARDATE, non
# quelle che si sono viste VUOTE. Un muro alle spalle non e' meno reale perche'
# non lo si sta osservando. La forma corretta e' lo sgombero per raggio (si
# cancella una cella quando un raggio le passa attraverso). Finche' non c'e',
# qui si tiene tutto: questi mondi sono statici.
#
# ATTENZIONE: con `people:=` NON usare 0 — le persone lascerebbero scie
# permanenti. In quel caso alzare a 120-300 s invece di azzerare.
/**:
  ros__parameters:
    grid_half_width: 10.0
    map_decay_sec: 0.0
