# GENERATO DA scripts/gen_missions.py — non modificare a mano.
# Mondo: long_wall_false_north — muro 18 m; il varco nord sembra chiuso ma cela una strettoia
#
#   ros2 launch g1_sim g1_a_star_mpc.launch.py world:=long_wall_false_north \
#        use_mission:=true \
#        mission_file:=$(ros2 pkg prefix g1_sim)/share/g1_sim/config/mission_long_wall_false_north.yaml
#
# reach_radius > goal_reached_radius (0.25) del profilo G1: sotto quella soglia
# a_star_node smette di ripianificare, quindi una soglia piu' stretta bloccherebbe
# la missione a un passo dal traguardo.
frame_id: odom
reach_radius:     0.35
leg_timeout_sec: 540.0

waypoints:
  - { x:   6.00, y:   4.00, yaw: 0.0, name: "goal" }
